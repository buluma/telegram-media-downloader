<div id="page-queue" class="hidden max-w-5xl mx-auto px-3 sm:px-4">
                    <!-- Top toolbar — chips, sort, search, global actions -->
                    <section class="bg-tg-panel rounded-xl p-3 mb-3">
                        <div id="queue-chips" class="flex flex-wrap gap-1.5 mb-3"></div>
                        <div class="flex flex-wrap items-center gap-2">
                            <div class="relative flex-1 min-w-[180px]">
                                <i class="ri-search-line absolute left-3 top-1/2 -translate-y-1/2 text-tg-textSecondary"></i>
                                <input id="queue-search" type="text" autocomplete="off"
                                    class="tg-input w-full pl-9 text-sm"
                                    data-i18n-placeholder="queue.search_placeholder"
                                    placeholder="Search filename or group…">
                            </div>
                            <select id="queue-sort" class="tg-input text-sm">
                                <option value="addedAt" data-i18n="queue.sort.added">Added time</option>
                                <option value="size" data-i18n="queue.sort.size">Size</option>
                                <option value="progress" data-i18n="queue.sort.progress">Progress</option>
                                <option value="group" data-i18n="queue.sort.group">Group</option>
                                <option value="filename" data-i18n="queue.sort.filename">Filename</option>
                            </select>
                            <div class="flex items-center gap-1.5 ml-auto">
                                <button id="queue-pause-all" type="button"
                                    class="px-3 py-1.5 text-xs rounded-lg bg-tg-bg/60 hover:bg-tg-hover text-tg-text flex items-center gap-1.5"
                                    data-i18n-title="queue.action.pause_all" title="Pause all">
                                    <i class="ri-pause-line"></i><span class="hidden sm:inline" data-i18n="queue.action.pause_all">Pause all</span>
                                </button>
                                <button id="queue-resume-all" type="button"
                                    class="px-3 py-1.5 text-xs rounded-lg bg-tg-bg/60 hover:bg-tg-hover text-tg-text flex items-center gap-1.5"
                                    data-i18n-title="queue.action.resume_all" title="Resume all">
                                    <i class="ri-play-line"></i><span class="hidden sm:inline" data-i18n="queue.action.resume_all">Resume all</span>
                                </button>
                                <button id="queue-retry-all" type="button"
                                    class="px-3 py-1.5 text-xs rounded-lg bg-tg-bg/60 hover:bg-tg-hover text-tg-text flex items-center gap-1.5 disabled:opacity-40 disabled:cursor-not-allowed"
                                    data-i18n-title="queue.action.retry_all" title="Retry all failed" disabled>
                                    <i class="ri-refresh-line"></i><span class="hidden sm:inline" data-i18n="queue.action.retry_all">Retry all</span>
                                </button>
                                <button id="queue-clear-finished" type="button"
                                    class="px-3 py-1.5 text-xs rounded-lg bg-tg-bg/60 hover:bg-tg-hover text-tg-text flex items-center gap-1.5"
                                    data-i18n-title="queue.action.clear_finished" title="Clear finished">
                                    <i class="ri-check-double-line"></i><span class="hidden sm:inline" data-i18n="queue.action.clear_finished">Clear finished</span>
                                </button>
                                <button id="queue-cancel-all" type="button"
                                    class="px-3 py-1.5 text-xs rounded-lg bg-red-500/15 hover:bg-red-500/25 text-red-400 flex items-center gap-1.5"
                                    data-i18n-title="queue.action.cancel_all" title="Cancel all queued">
                                    <i class="ri-close-circle-line"></i><span class="hidden sm:inline" data-i18n="queue.action.cancel_all">Cancel queued</span>
                                </button>
                            </div>
                        </div>
                    </section>

                    <!-- Floating selection bar — appears at the bottom of the
                         viewport when at least one row is selected. Mirrors
                         the action vocabulary of the toolbar but applies it
                         only to the selected subset. Clear button on the
                         right exits select-mode + drops the Set. -->
                    <div id="queue-selection-bar"
                         class="hidden fixed left-1/2 -translate-x-1/2 bottom-16 md:bottom-4 z-30 bg-tg-panel border border-tg-border shadow-lg rounded-xl px-3 py-2 flex items-center gap-2 max-w-[calc(100vw-1rem)] flex-wrap"
                         role="toolbar" aria-label="Batch actions">
                        <span id="queue-selection-count" class="text-xs text-tg-text font-medium px-2 tabular-nums"></span>
                        <span class="w-px h-5 bg-tg-border"></span>
                        <button data-batch-action="pause" type="button"
                            class="px-2.5 py-1 text-xs rounded-lg bg-tg-bg/60 hover:bg-tg-hover text-tg-text flex items-center gap-1.5"
                            data-i18n-title="queue.action.pause" title="Pause">
                            <i class="ri-pause-line"></i><span class="hidden sm:inline" data-i18n="queue.action.pause">Pause</span>
                        </button>
                        <button data-batch-action="resume" type="button"
                            class="px-2.5 py-1 text-xs rounded-lg bg-tg-bg/60 hover:bg-tg-hover text-tg-text flex items-center gap-1.5"
                            data-i18n-title="queue.action.resume" title="Resume">
                            <i class="ri-play-line"></i><span class="hidden sm:inline" data-i18n="queue.action.resume">Resume</span>
                        </button>
                        <button data-batch-action="retry" type="button"
                            class="px-2.5 py-1 text-xs rounded-lg bg-tg-bg/60 hover:bg-tg-hover text-tg-text flex items-center gap-1.5"
                            data-i18n-title="queue.action.retry" title="Retry">
                            <i class="ri-refresh-line"></i><span class="hidden sm:inline" data-i18n="queue.action.retry">Retry</span>
                        </button>
                        <button data-batch-action="dismiss" type="button"
                            class="px-2.5 py-1 text-xs rounded-lg bg-tg-bg/60 hover:bg-tg-hover text-tg-text flex items-center gap-1.5"
                            data-i18n-title="queue.action.dismiss" title="Dismiss">
                            <i class="ri-delete-bin-line"></i><span class="hidden sm:inline" data-i18n="queue.action.dismiss">Dismiss</span>
                        </button>
                        <button data-batch-action="cancel" type="button"
                            class="px-2.5 py-1 text-xs rounded-lg bg-red-500/15 hover:bg-red-500/25 text-red-400 flex items-center gap-1.5"
                            data-i18n-title="queue.action.cancel" title="Cancel">
                            <i class="ri-close-line"></i><span class="hidden sm:inline" data-i18n="queue.action.cancel">Cancel</span>
                        </button>
                        <span class="w-px h-5 bg-tg-border"></span>
                        <button id="queue-selection-clear" type="button"
                            class="px-2.5 py-1 text-xs rounded-lg text-tg-textSecondary hover:text-tg-text hover:bg-tg-bg/60 flex items-center gap-1.5"
                            data-i18n-title="queue.selection.clear" title="Clear selection (Esc)">
                            <i class="ri-close-circle-line"></i><span class="hidden sm:inline" data-i18n="queue.selection.clear">Clear</span>
                        </button>
                    </div>

                    <!-- Body: virtualised table -->
                    <section class="bg-tg-panel rounded-xl overflow-hidden">
                        <!-- Sticky column header -->
                        <div class="hidden md:grid grid-cols-[32px_40px_minmax(0,2.5fr)_90px_minmax(140px,1.4fr)_80px_70px_90px_120px] items-center gap-2 px-3 py-2 text-[11px] uppercase tracking-wide text-tg-textSecondary border-b border-tg-border bg-tg-bg/30">
                            <span class="flex items-center justify-center">
                                <input id="queue-select-all" type="checkbox"
                                    class="rounded border-tg-border bg-tg-bg cursor-pointer accent-tg-blue"
                                    data-i18n-title="queue.selection.select_all_visible" title="Select all visible">
                            </span>
                            <span></span>
                            <span data-i18n="queue.col.file">File</span>
                            <span class="text-right" data-i18n="queue.col.size">Size</span>
                            <span data-i18n="queue.col.progress">Progress</span>
                            <span class="text-right" data-i18n="queue.col.speed">Speed</span>
                            <span class="text-right" data-i18n="queue.col.eta">ETA</span>
                            <span data-i18n="queue.col.status">Status</span>
                            <span class="text-right" data-i18n="queue.col.actions">Actions</span>
                        </div>
                        <!-- Append-only viewport. Each batch renders 50 rows
                             plus a sentinel; an IntersectionObserver appends
                             the next batch on scroll. WS progress events
                             patch the matching DOM row in place (no
                             re-render) so a 1000-job queue stays smooth
                             even with dozens of concurrent downloads. -->
                        <div id="queue-viewport" class="overflow-y-auto" style="height: calc(100dvh - 280px); min-height: 320px;">
                            <div id="queue-rows" class="divide-y divide-tg-border/30"></div>
                            <div id="queue-load-more" class="flex items-center justify-center py-3 text-xs text-tg-textSecondary hidden">
                                <i class="ri-loader-4-line animate-spin mr-2"></i>
                                <span data-i18n="queue.loading_more">Loading more…</span>
                            </div>
                            <div id="queue-empty" class="hidden text-center py-12">
                                <i class="ri-download-cloud-2-line text-4xl text-tg-textSecondary mb-2"></i>
                                <p class="text-sm text-tg-textSecondary" data-i18n="queue.empty.title">Queue is empty</p>
                                <p class="text-xs text-tg-textSecondary opacity-70 mt-1" data-i18n="queue.empty.body">Start the engine or kick off a backfill — every download flows through here.</p>
                            </div>
                        </div>
                    </section>

                    <!-- Bottom strip: aggregate counters + speed throttle -->
                    <section class="bg-tg-panel rounded-xl p-3 mt-3 flex flex-wrap items-center gap-3">
                        <div id="queue-aggregate" class="text-xs text-tg-textSecondary tabular-nums flex items-center gap-3 flex-wrap"></div>
                        <div class="flex items-center gap-2 ml-auto">
                            <label for="queue-throttle" class="text-xs text-tg-textSecondary" data-i18n="queue.throttle.label">Max speed</label>
                            <input id="queue-throttle" type="range" min="0" max="52428800" step="262144" value="0" class="w-32 accent-tg-blue">
                            <span id="queue-throttle-value" class="text-xs text-tg-text tabular-nums w-20 text-right" data-i18n="queue.throttle.unlimited">Unlimited</span>
                        </div>
                    </section>
                </div>
