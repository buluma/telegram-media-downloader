<div id="page-backfill" class="hidden max-w-5xl mx-auto px-3 sm:px-4">
                    <!-- Card A — Active jobs -->
                    <section class="bg-tg-panel rounded-xl p-4 mb-4">
                        <h3 class="text-tg-text font-medium mb-3 flex items-center gap-2">
                            <i class="ri-play-circle-line text-tg-blue"></i>
                            <span data-i18n="backfill.active.title">Active backfills</span>
                        </h3>
                        <div id="backfill-active-list" class="space-y-2"></div>
                        <div id="backfill-active-empty" class="hidden text-center py-6">
                            <i class="ri-history-line text-3xl text-tg-textSecondary mb-2"></i>
                            <p class="text-sm text-tg-textSecondary" data-i18n="backfill.empty.title">No active backfills</p>
                            <p class="text-xs text-tg-textSecondary opacity-70 mt-1" data-i18n="backfill.empty.body">Start one below to pull older messages from a chat.</p>
                        </div>
                    </section>

                    <!-- Card B — Start a new backfill -->
                    <section class="bg-tg-panel rounded-xl p-4 mb-4">
                        <h3 class="text-tg-text font-medium mb-3 flex items-center gap-2">
                            <i class="ri-add-circle-line text-tg-green"></i>
                            <span data-i18n="backfill.start.title">Start a new backfill</span>
                        </h3>
                        <div class="space-y-3">
                            <div>
                                <label class="block text-xs text-tg-textSecondary mb-1.5" data-i18n="backfill.start.group_label">Group</label>
                                <div class="relative">
                                    <i class="ri-search-line absolute left-3 top-1/2 -translate-y-1/2 text-tg-textSecondary"></i>
                                    <input id="backfill-group-search" type="text" autocomplete="off"
                                        class="tg-input w-full pl-9 text-sm"
                                        data-i18n-placeholder="backfill.start.group_placeholder"
                                        placeholder="Type to search your monitored chats…">
                                </div>
                                <div id="backfill-group-results" class="mt-1 max-h-56 overflow-y-auto rounded-lg border border-tg-border/40 hidden"></div>
                                <div id="backfill-group-selected" class="mt-2 hidden flex items-center gap-2 p-2 bg-tg-bg/50 rounded-lg">
                                    <i class="ri-check-line text-tg-green"></i>
                                    <span id="backfill-group-selected-name" class="text-sm text-tg-text font-medium flex-1 min-w-0 truncate"></span>
                                    <button type="button" id="backfill-group-clear" class="text-xs text-tg-textSecondary hover:text-tg-text">
                                        <i class="ri-close-line"></i>
                                    </button>
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs text-tg-textSecondary mb-1.5" data-i18n="backfill.start.limit_label">Limit</label>
                                <div id="backfill-preset-row" class="flex flex-wrap gap-2 mb-2"></div>
                                <input id="backfill-custom-limit" type="number" min="1" max="50000"
                                    class="tg-input w-full text-sm"
                                    data-i18n-placeholder="backfill.start.custom_limit_placeholder"
                                    placeholder="Custom limit (1–50,000)">
                            </div>
                            <button id="backfill-start-btn" type="button"
                                class="tg-btn w-full disabled:opacity-50 disabled:cursor-not-allowed">
                                <i class="ri-download-line mr-2"></i>
                                <span data-i18n="backfill.start.button">Start backfill</span>
                            </button>
                            <p id="backfill-start-warn" class="text-xs text-tg-warning hidden">
                                <i class="ri-error-warning-line mr-1"></i>
                                <span data-i18n="backfill.start.warn_all">Pulling all history may download tens of thousands of files and take hours.</span>
                            </p>
                        </div>
                    </section>

                    <!-- Card C — Recent jobs (last 30 days) -->
                    <section class="bg-tg-panel rounded-xl p-4">
                        <div class="flex items-center justify-between mb-3 gap-2">
                            <h3 class="text-tg-text font-medium flex items-center gap-2 min-w-0">
                                <i class="ri-time-line text-tg-textSecondary"></i>
                                <span class="truncate" data-i18n="backfill.recent.title">Recent backfills (30 days)</span>
                            </h3>
                            <button type="button" id="backfill-recent-clear" class="hidden text-xs px-2.5 py-1 rounded-md border border-tg-border text-tg-textSecondary hover:text-red-400 hover:border-red-400/60 transition-colors flex-shrink-0">
                                <i class="ri-delete-bin-line mr-1"></i><span data-i18n="backfill.recent.clear_all">Clear all</span>
                            </button>
                        </div>
                        <div id="backfill-recent-list" class="space-y-2"></div>
                        <p id="backfill-recent-empty" class="hidden text-sm text-tg-textSecondary text-center py-4" data-i18n="backfill.recent.empty">No completed backfills yet.</p>
                    </section>
                </div>
