# Release pipeline for the tgdl-ml sidecar.
#
# Triggered by an `ml-v*` tag push.

name: release-tgdl-ml

on:
  push:
    tags:
      - 'ml-v*'

permissions:
  contents: read
  packages: write

jobs:
  build-docker:
    name: docker (linux/amd64 + linux/arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: ./tgdl-ml
          file: ./tgdl-ml/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            buluma/tgdl-ml:${{ github.ref_name }}
            buluma/tgdl-ml:latest
            ghcr.io/buluma/tgdl-ml:${{ github.ref_name }}
            ghcr.io/buluma/tgdl-ml:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
