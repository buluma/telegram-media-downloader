name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'  # Mondays 05:17 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only cancel superseded PR runs. A push to main and the Monday cron share
  # refs/heads/main, and cancelling those would leave the Security tab holding
  # results from whichever scan happened to survive.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    # Uploading results needs code scanning, which a private repo only has with
    # GitHub Advanced Security. Without it the scan runs and then fails at the
    # upload step on every PR, so skip it while the repo is private. A skipped
    # job counts as passing for required checks.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
