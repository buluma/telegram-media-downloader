[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tgdl-ml"
version = "0.1.0"
description = "Telegram Media Downloader ML sidecar for CLIP embeddings, OCR, and face recognition"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "telegram-media-downloader maintainers" }]
keywords = ["machine-learning", "clip", "ocr", "face-recognition", "telegram-media-downloader"]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pillow>=10,<13",
    "pydantic>=2,<3",
    "onnxruntime>=1.18,<2",
    "huggingface-hub>=0.24,<2",
    "numpy>=1.24,<3",
]

[project.scripts]
tgdl-ml = "tgdl_ml.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["tgdl_ml"]

[tool.hatch.build.targets.sdist]
include = ["tgdl_ml", "README.md", "pyproject.toml"]
